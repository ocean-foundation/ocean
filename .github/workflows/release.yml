name: Tagged release

on:
  push:
    tags:
      - 'nightly-*'
      - 'v[0-9]*'
      - '[0-9]*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event.deleted == false
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      bootstrap_repo: ${{ steps.release.outputs.bootstrap_repo }}
      bootstrap_tag: ${{ steps.release.outputs.bootstrap_tag }}
      matrix: ${{ steps.release.outputs.matrix }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: release
        name: Select the previous release and runner matrix
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 .github/scripts/release.py prepare --tag "$RELEASE_TAG"

  build:
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    name: ${{ matrix.arch }}-${{ matrix.system }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_TARGET: ${{ matrix.arch }}-${{ matrix.system }}
      PACKAGES: ${{ matrix.packages }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ocean-foundation/ocean-src
          ref: refs/tags/${{ needs.prepare.outputs.tag }}
          path: build/.nightly-stdlib
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux dependencies
        if: matrix.system == 'linux' && !matrix.image
        run: |
          sudo apt-get update
          sudo apt-get install -y $PACKAGES
          bash .github/scripts/install-llvm.sh
      - name: Install macOS dependencies
        if: matrix.system == 'macos'
        run: |
          brew install $PACKAGES
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"
      - name: Install Windows dependencies
        if: matrix.system == 'windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: ${{ matrix.packages }}
      - name: Download and verify the previous compiler
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BOOTSTRAP_REPO: ${{ needs.prepare.outputs.bootstrap_repo }}
          BOOTSTRAP_TAG: ${{ needs.prepare.outputs.bootstrap_tag }}
        run: |
          python .github/scripts/release.py bootstrap --tag "$BOOTSTRAP_TAG" \
            --repo "$BOOTSTRAP_REPO" --target "$RELEASE_TARGET"
      - name: Build and package native Unix release
        if: matrix.system != 'windows' && !matrix.image
        run: python .github/scripts/release.py package --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - name: Build and package Windows release
        if: matrix.system == 'windows'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          if [[ ! -f "$MINGW_PREFIX/bin/pkg-config.exe" ]]; then
            cp "$MINGW_PREFIX/bin/pkgconf.exe" "$MINGW_PREFIX/bin/pkg-config.exe"
          fi
          python .github/scripts/release.py package --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - uses: docker/setup-qemu-action@v3
        if: matrix.image
        with:
          platforms: riscv64
      - name: Build and package RISC-V release under QEMU
        if: matrix.image
        env:
          BUILD_IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --platform linux/riscv64 \
            --volume "$PWD:/work" --workdir /work \
            --env RELEASE_TAG --env RELEASE_TARGET --env PACKAGES "$BUILD_IMAGE" \
            bash -euc '
              apt-get update
              apt-get install -y $PACKAGES
              mkdir -p /tmp/ocean-tools
              for tool in clang ld.lld wasm-ld llvm-ar llvm-ranlib; do
                ln -s "/usr/bin/$tool-21" "/tmp/ocean-tools/$tool"
              done
              export PATH="/tmp/ocean-tools:$PATH"
              git config --global --add safe.directory /work
              python3 .github/scripts/release.py package --tag "$RELEASE_TAG" \
                --target "$RELEASE_TARGET" --defer-compression
            '
          sudo chown -R "$(id -u):$(id -g)" dist
          python .github/scripts/release.py compress --tag "$RELEASE_TAG" --target "$RELEASE_TARGET"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}-${{ matrix.system }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Verify and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
          RELEASE_MATRIX: ${{ needs.prepare.outputs.matrix }}
        run: |
          cd dist
          for target in $(jq -r '.include[] | .arch + "-" + .system' <<< "$RELEASE_MATRIX"); do
            test -f "ocean_${RELEASE_TAG}_${target}.tar"
            test -f "ocean-deps_${RELEASE_TAG}_${target}.tar.xz"
            if [[ "$target" == *-windows ]]; then
              test -f "ocean_${RELEASE_TAG}_${target}.zip"
            fi
            sha256sum --strict --check "SHA256SUMS_$target.txt"
          done
          if state=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            if [[ "$state" == false ]]; then exit 0; fi
          else
            options=(--draft)
            if [[ "$PRERELEASE" == true ]]; then options+=(--prerelease); fi
            gh release create "$RELEASE_TAG" --verify-tag --title "$RELEASE_TAG" "${options[@]}"
          fi
          gh release upload "$RELEASE_TAG" ./* --clobber
          gh release edit "$RELEASE_TAG" --draft=false
